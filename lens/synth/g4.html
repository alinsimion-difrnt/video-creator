<title>Pattern Catalog Approval</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one short column of questions; each card states what it is, Claude's reason, and two buttons. */
:root{--bg:#f5f5f2;--surface:#ffffff;--fg:#1c1e21;--muted:#5f636a;--line:#deded8;--accent:#b4410c;
--ok:#1f7a4d;--ok-bg:#e3f2ea;--no:#a3361f;--no-bg:#f8e3dd;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--surface:#1b1d20;--fg:#ececea;
--muted:#a3a7ad;--line:#2e3135;--accent:#fb8c4a;--ok:#6fd3a0;--ok-bg:#163326;--no:#f19b85;--no-bg:#3a1c15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--surface:#1b1d20;--fg:#ececea;--muted:#a3a7ad;--line:#2e3135;--accent:#fb8c4a;
--ok:#6fd3a0;--ok-bg:#163326;--no:#f19b85;--no-bg:#3a1c15;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans)}
main{max-width:44rem;margin:0 auto;padding:1.5rem 16px 4rem;display:grid;gap:1rem}
h1{font-size:1.5rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}.muted{color:var(--muted)}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.count{font:500 .9rem var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem;display:grid;gap:.6rem;min-width:0}
.card.agree{border-color:var(--ok)}.card.disagree{border-color:var(--no)}
.card h2{font-size:1.05rem;margin:0;text-wrap:balance}
.why{font-size:.92rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.9rem}
a{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
button{font:600 .95rem var(--sans);border-radius:6px;padding:.55rem 1rem;cursor:pointer;border:1px solid var(--line);
background:var(--surface);color:var(--fg)}
button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:var(--surface)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;font-size:.92rem;width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:5px;
background:var(--bg);color:var(--fg)}
.msg{font-size:.85rem;color:var(--muted)}
.banner{border:1px solid var(--no);background:var(--no-bg);padding:.6rem .8rem;border-radius:6px}
</style>
<main>
  <div class="eyebrow">Explainer lens · gate G4</div>
  <h1>Pattern Catalog Approval</h1>
  <p>Claude grouped the motion in 55 explainers into named patterns for the recipe book. Each card below
    is one decision with Claude's recommendation. Tap <b>Agree</b> or <b>Disagree</b>. A note is optional.</p>
  <p class="count" id="count"></p>
  <div id="banner" class="banner" hidden></div>
  <div id="list"></div>
</main>
<script>
const ITEMS = /*ITEMS*/[];
const state = { saved: {}, busy: {}, msg: {}, notes: {} };
let db = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function card(it, i) {
  const v = state.saved[it.key]?.verdict, busy = state.busy[it.key] || !db;
  const links = it.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">Watch: ${esc(l.label)}</a>`).join("");
  return `<article class="card ${v || ""}" id="c${i}">
    <h2>${esc(it.ask)}</h2>
    <p>${esc(it.what)}</p>
    ${it.why ? `<p class="why">Claude: ${esc(it.why)}</p>` : ""}
    ${links ? `<div class="links">${links}</div>` : ""}
    <input type="text" id="n${i}" placeholder="Note (optional)" aria-label="Note" value="${esc(state.notes[it.key] ?? state.saved[it.key]?.note ?? "")}">
    <div class="row">
      <button class="yes" data-i="${i}" data-v="agree" aria-pressed="${v === "agree"}"${busy ? " disabled" : ""}>Agree</button>
      <button class="no" data-i="${i}" data-v="disagree" aria-pressed="${v === "disagree"}"${busy ? " disabled" : ""}>Disagree</button>
      <span class="msg" role="status">${esc(state.msg[it.key] || "")}</span>
    </div>
  </article>`;
}

function render() {
  document.getElementById("list").innerHTML = ITEMS.map(card).join("");
  const done = ITEMS.filter(it => state.saved[it.key]?.verdict).length;
  document.getElementById("count").textContent = `${done} of ${ITEMS.length} answered`;
  ITEMS.forEach((it, i) => {
    const n = document.getElementById("n" + i);
    n.oninput = () => { state.notes[it.key] = n.value; };
    document.querySelectorAll(`#c${i} button`).forEach(b => b.onclick = () => save(it, b.dataset.v));
  });
}

async function save(it, verdict) {
  if (!db) return;
  const note = (state.notes[it.key] ?? state.saved[it.key]?.note ?? "").trim();
  state.busy[it.key] = true; state.msg[it.key] = "Saving…"; render();
  try {
    await db.collection("g4").doc(it.key).set({ verdict, note, saved_at: new Date().toISOString() });
    state.saved[it.key] = { verdict, note }; state.msg[it.key] = "Saved.";
  } catch (e) {
    state.msg[it.key] = e && e.code === "invalid_argument" ? "You can't save on this page." : "Not saved. Check your connection and try again.";
  }
  state.busy[it.key] = false; render();
}

render();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) {
    const b = document.getElementById("banner"); b.hidden = false;
    b.textContent = "Saving is off in this view. Open the page on claude.ai while signed in."; render(); return;
  }
  db.collection("g4").onSnapshot(snap => {
    const next = {}; for (const d of snap.docs) next[d.id] = d.data();
    state.saved = { ...state.saved, ...next }; render();
  }, () => { const b = document.getElementById("banner"); b.hidden = false; b.textContent = "Lost the link to saved answers. Reload the page."; });
  render();
})();
</script>
