<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Panel starter (ADR 0034, skill build-panel): copy to projects/<p>/panel/index.html and replace the example
     scene. What every panel shares, taken from acme-reel, x-ads and facebook-algorithm: the 1080 x 840 page,
     the paper/dots background that drifts, the fade into the base at the bottom, the type scale for a phone and
     the GSAP helpers. Times are word starts from `create words <p> --times`, never guesses.
beats:
  A 0.00-4.95  "<words>"  device: <ui|hero number|map|people|logo wall|object|kinetic type|diagram>  <what shows>
look: <palette and why (ADR 0031 fit test)> -->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="gsap.min.js"></script>
<style>
:root {
  /* acme (brands/acme/DESIGN.md); for a Acme beat: Space Grotesk + Inter, navy #3E0863, orange #00AA90 */
  --ink: #0A0A0A; --ink-2: #262626; --muted: #737373; --hair: #E5E5E5; --fill: #F5F5F5; --bg: #FFFFFF;
  --accent: #A70056; --mint: #7CE7C8; --prism: linear-gradient(90deg, #8A7CFF, #7CC1FF, #7CE7C8);
  --shadow: 0 1px 2px rgba(10,10,10,.05), 0 24px 60px -24px rgba(10,10,10,.28);
  --head: "Geist", Inter, system-ui, sans-serif; --text: "Geist", Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 840px; overflow: hidden; background: var(--bg); }
body { font-family: var(--text); color: var(--ink); -webkit-font-smoothing: antialiased; position: relative; }
#bgwrap { position: absolute; inset: 0; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; }
#bg-blob1 { width: 620px; height: 620px; background: #DCE6FF; left: -160px; top: -200px; }
#bg-blob2 { width: 560px; height: 560px; background: #D9F7EE; right: -180px; top: 120px; }
#bg-dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(10,10,10,.10) 1.4px, transparent 1.6px);
  background-size: 36px 36px; -webkit-mask-image: linear-gradient(#000, rgba(0,0,0,.6) 60%, transparent); }
/* the bottom ~110 px fades into the base's background, so the seam is invisible; nothing important below y 720 */
#fade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(rgba(255,255,255,0), var(--bg)); z-index: 50; }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }
.card { background: #fff; border: 1px solid var(--hair); border-radius: 32px; box-shadow: var(--shadow); }
/* a phone: nothing under 40 px except uppercase kickers (34 px); hero numbers 160-230 px and they fit 1080 */
.kick { font: 700 34px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h1 { font: 700 120px/1 var(--head); letter-spacing: -.04em; }
.h2 { font: 700 80px/1.04 var(--head); letter-spacing: -.03em; }
.h3 { font: 700 52px/1.1 var(--head); letter-spacing: -.02em; }
.body { font: 500 42px/1.3 var(--text); color: var(--ink-2); }
.hero { font: 700 200px/1 var(--head); letter-spacing: -.05em; } /* Geist and Space Grotesk stop at 700 */
.acc { color: var(--accent); }
.mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
.wd { display: inline-block; }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; background: #fff;
  border: 1px solid var(--hair); box-shadow: var(--shadow); font: 600 40px/1 var(--text); }
.chip img, .logo { height: 44px; }
</style>
</head>
<body>
<div id="bgwrap"><div class="blob" id="bg-blob1"></div><div class="blob" id="bg-blob2"></div><div id="bg-dots"></div></div>

<!-- A 0.00-4.95: (example: kicker, a masked headline, a chip; replace) -->
<div class="scene" id="sA">
  <div class="abs" style="left:80px; top:200px;">
    <div class="kick" id="aK">Kicker</div>
    <div class="h1" style="margin-top:22px;"><span class="mask"><span class="wd" id="a1">Headline</span></span>
      <span class="mask"><span class="wd acc" id="a2">word.</span></span></div>
    <div class="chip" id="aC" style="margin-top:34px;"><img src="logos/x.svg" alt="">A real logo</div>
  </div>
</div>

<div id="fade"></div>
<script>
const tl = gsap.timeline({ paused: true });
const $ = (s) => document.querySelector(s);
const E = { out: "expo.out", o4: "power4.out", spring: "back.out(1.6)", soft: "back.out(1.2)", inout: "power2.inOut" };
const DUR = 30.0; // the edited take's length (create words prints it as the last scene's end)

// ambient drift so no frame is dead
tl.to("#bg-blob1", { x: 260, y: 120, duration: DUR, ease: "sine.inOut" }, 0);
tl.to("#bg-blob2", { x: -220, y: -60, duration: DUR, ease: "sine.inOut" }, 0);
tl.to("#bg-dots", { backgroundPosition: "0px -180px", duration: DUR, ease: "none" }, 0);

// a scene fades in over 0.18 s and out over 0.25 s before the next one starts
function scene(id, t0, t1) {
  tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none", immediateRender: false }, t0);
  if (t1 != null) {
    tl.to(id, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t1 - 0.25);
    tl.set(id, { y: 0 }, t1 + 0.01);
  }
}
// every `from` is reset in its `to` (a y left at 80 misaligned acme-reel's founders)
const up = (t, sel, o) => tl.fromTo(sel, Object.assign({ y: 70, opacity: 0 }, o && o.from), Object.assign({ y: 0, opacity: 1, duration: 0.7, ease: E.out }, o && o.to), t);
const pop = (t, sel, o) => tl.fromTo(sel, Object.assign({ scale: 0.4, opacity: 0, rotation: -8 }, o && o.from), Object.assign({ scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: E.spring }, o && o.to), t);
const mword = (t, sel) => tl.fromTo(sel, { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: E.o4 }, t);
const float = (sel, t0, t1, amp) => tl.to(sel, { y: "-=" + (amp || 14), duration: (t1 - t0) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0);
// text that changes (typing, counting) is painted from the playhead on every seek, never from tween callbacks:
// renders and stills seek in any order (seek safety, docs/learnings/presenter-reels.md section e)
const painters = [];
const prog = (t, t0, t1) => (t1 > t0 ? Math.max(0, Math.min(1, (t - t0) / (t1 - t0))) : +(t >= t0));
function type(sel, text, t0, t1) { // a field typing on his words
  const el = $(sel);
  painters.push((t) => { el.textContent = text.slice(0, Math.round(text.length * prog(t, t0, t1))); });
}
function count(sel, to, t0, t1, fmt) { // a count-up that lands on its word, then a small punch;
  // fmt: (v) => "€" + Math.round(v).toLocaleString("en-US") for a currency
  const el = $(sel), ease = gsap.parseEase("power3.out"), f = fmt || ((v) => Math.round(v).toLocaleString("en-US"));
  painters.push((t) => { el.textContent = f(to * ease(prog(t, t0, t1))); });
  tl.fromTo(sel, { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t1);
}
function draw(path, t, d) { // an SVG path drawing itself
  const L = path.getTotalLength();
  path.setAttribute("stroke-dasharray", L); path.setAttribute("stroke-dashoffset", L);
  tl.to(path, { attr: { "stroke-dashoffset": 0 }, duration: d || 0.7, ease: E.inout }, t);
}

// ---------- A ----------
scene("#sA", 0.0, 4.95);
up(0.05, "#aK", { from: { y: 20 } });
mword(0.15, "#a1"); mword(0.35, "#a2");
pop(0.8, "#aC", { from: { rotation: 0, scale: 0.7 } });

tl.set({}, {}, DUR);
window.seek = (t) => { tl.seek(t, false); painters.forEach((p) => p(t)); }; // returns nothing (a returned
// timeline hangs the renderer)
window.seek(0);
</script>
</body>
</html>
