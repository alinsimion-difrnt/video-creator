<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>captions</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/gsap.min.js"></script>
<!-- Burned-in captions over a finished plate (create/kit, from the Acme v2 final). Generated by
     `create burn`: frame size, caption band and style come from the project's tokens (brand video.yaml). -->
<style>
  {{CSS_VARS}}
  html, body { margin: 0; padding: 0; background: #000; }
  #root { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: #000; }
  #plate { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); z-index: 1; }
  #stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); z-index: 2; pointer-events: none; }
  /* The group sits centred in the frame's caption band (config create.design.frames.<frame>.caption_band). */
  .cap {
    position: absolute; left: var(--band-cx); top: var(--band-cy);
    display: block; width: max-content; max-width: var(--max-w); box-sizing: border-box;
    padding: var(--pad-y) var(--pad-x);
    font-family: var(--font); font-weight: var(--weight); font-size: var(--size); line-height: var(--lh);
    letter-spacing: var(--tracking); text-transform: var(--transform);
    color: var(--text); text-align: center; white-space: nowrap;
  }
  .cap .bg { position: absolute; inset: 0; border-radius: var(--radius); background: var(--bg); opacity: 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 4px 10px -2px rgba(0,0,0,.10), 0 14px 34px -10px rgba(0,0,0,.26); }
  .cap.two .bg { border-radius: calc(var(--size) * 0.9); }
  .cap.nobg .bg { display: none; }
  .cap .txt { position: relative; opacity: 0; }
  .w { opacity: var(--dim); -webkit-text-stroke: var(--stroke-w) var(--stroke); paint-order: stroke fill; }
</style>
</head>
<body>
<div id="root" data-composition-id="captions" data-width="{{W}}" data-height="{{H}}" data-start="0"
     data-duration="{{DURATION}}">
  <video id="plate" src="plate.mp4" muted playsinline data-start="0" data-duration="{{DURATION}}"
         data-track-index="0"></video>
  <div id="stage" data-layout-allow-overlap="burned-in captions sit over the finished plate by design"></div>
</div>
<script type="application/json" id="caption-data">{{DATA}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("caption-data").textContent);
  const DUR = D.duration, GROUPS = D.groups, KARAOKE = D.kind === "karaoke";
  const LIGHT = KARAOKE || D.active !== D.text;  // a pill can light the spoken word too (acme vertical)
  const stage = document.getElementById("stage");

  const pills = GROUPS.map(function (g, gi) {
    const el = document.createElement("div");
    el.className = "cap" + (D.has_bg ? "" : " nobg");
    el.id = "g" + gi;
    if (g.cy) el.style.top = g.cy + "px";  // presenter video: placed below the face (create/burn.py)
    el.setAttribute("data-role", "caption");
    el.setAttribute("data-layout-allow-overlap", "caption over the plate; adjacent groups crossfade");
    const bg = document.createElement("div"); bg.className = "bg"; el.appendChild(bg);
    const txt = document.createElement("div"); txt.className = "txt";
    g.words.forEach(function (w, wi) {
      if (wi) txt.appendChild(document.createTextNode(" "));
      const s = document.createElement("span"); s.className = "w"; s.textContent = w.w; txt.appendChild(s);
    });
    el.appendChild(txt); stage.appendChild(el);
    return el;
  });

  // Two balanced lines only when a group is wider than the style's max width (layout only).
  function balance() {
    pills.forEach(function (el) {
      if (el.classList.contains("two") || el.scrollWidth <= D.max_width) return;
      const spans = Array.prototype.slice.call(el.querySelectorAll(".w"));
      if (spans.length < 2) {  // one word wider than the band: shrink it to fit instead of wrapping
        const size = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = Math.floor(size * D.max_width / el.scrollWidth) + "px";
        return;
      }
      const widths = spans.map(function (s) { return s.getBoundingClientRect().width; });
      let best = 1, bestMax = Infinity;
      for (let k = 1; k < spans.length; k++) {
        const a = widths.slice(0, k).reduce(function (x, y) { return x + y; }, 0);
        const b = widths.slice(k).reduce(function (x, y) { return x + y; }, 0);
        if (Math.max(a, b) < bestMax) { bestMax = Math.max(a, b); best = k; }
      }
      spans[best].parentNode.insertBefore(document.createElement("br"), spans[best]);
      el.classList.add("two");
    });
  }
  balance();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(balance);

  gsap.set(".cap", { xPercent: -50, yPercent: -50 });
  gsap.set(".cap .bg, .cap .txt", { opacity: 0, y: 0 });
  gsap.set(".w", { opacity: D.dim, color: D.text });

  const SEAM = 0.15;  // gaps at or below this are one continuous caption stream
  const tl = gsap.timeline({ paused: true });
  GROUPS.forEach(function (g, gi) {
    const el = pills[gi], bg = el.querySelector(".bg"), txt = el.querySelector(".txt");
    const prev = GROUPS[gi - 1], next = GROUPS[gi + 1];
    const tIn = Math.max(0, g.start);
    const joinedIn = !!prev && g.start - prev.end <= SEAM;
    const joinedOut = !!next && next.start - g.end <= SEAM;
    tl.fromTo(txt, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, tIn);
    if (D.has_bg) {
      if (joinedIn) tl.fromTo(bg, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.inOut", immediateRender: false }, Math.max(0, tIn - 0.06));
      else tl.fromTo(bg, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, tIn);
    }
    const spans = el.querySelectorAll(".w");
    g.words.forEach(function (w, wi) {
      const at = Math.max(tIn, w.t - 0.04);
      tl.fromTo(spans[wi], { opacity: D.dim }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, at);
      if (LIGHT) {  // the spoken word takes the active colour, then hands it to the next word
        tl.set(spans[wi], { color: D.active }, at);
        const nextWord = g.words[wi + 1];
        if (nextWord) tl.set(spans[wi], { color: D.text }, Math.max(at + 0.01, nextWord.t - 0.04));
      }
    });
    let gone;
    if (joinedOut) {
      tl.to(txt, { opacity: 0, duration: 0.10, ease: "power2.in" }, next.start - 0.10);
      if (D.has_bg) tl.to(bg, { opacity: 0, duration: 0.10, ease: "power1.inOut" }, next.start - 0.04);
      gone = next.start + 0.06;
    } else {
      const tOut = Math.min(g.end, DUR - 0.10);
      tl.to(D.has_bg ? [txt, bg] : [txt], { opacity: 0, duration: 0.10, ease: "power2.in" }, tOut);
      gone = tOut + 0.10;
    }
    // Hard kill after the exit, so a word tween can never leave a group on screen.
    tl.set(el, { opacity: 0, visibility: "hidden" }, Math.min(gone, DUR));
  });
  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines["captions"] = tl;
})();
</script>
</body>
</html>
