<!-- A whole presenter video in one composition (create/kit, `create reel`): the product area with its
     widgets, the presenter's own video (layouts as in layout.html, a slow push-in per shot, a light grade),

     (face from F5 framing, word times from the timeline); this page only draws and animates. -->

  .cap .txt { position: relative; opacity: 0;
    filter: drop-shadow(0 0 2px rgba(5,20,40,1)) drop-shadow(0 0 6px rgba(5,20,40,.85)) drop-shadow(0 5px 14px rgba(5,20,40,.6)); }
  .cap.light .txt { filter: none; }
  .w { opacity: var(--dim); -webkit-text-stroke: var(--stroke-w) var(--stroke); paint-order: stroke fill; }
  .cap.light .w { -webkit-text-stroke: 0 transparent; }
  /* caption plate (plan caption_plate): white plate, ink words, soft shadow; sizes come from the page data */
  .cap.plate .txt { filter: none; }
  .cap.plate .w { -webkit-text-stroke: 0 transparent; }
  .w.pill { border-radius: .22em; padding: 0 .14em; margin: 0 -.06em; -webkit-text-stroke: 0 transparent; box-decoration-break: clone; }
</style>
</head>
<body>
<div id="root" data-composition-id="reel" data-width="{{OUT_W}}" data-height="{{OUT_H}}" data-start="0"
     data-duration="{{DURATION}}">
  <div id="canvas" data-layout-allow-overflow="the frame, scaled to the output size">
  <div id="product" class="{{PRODUCT_BG}}" data-layout-allow-overflow="product widgets fill their boxes">
    <div id="pbg" data-layout-allow-overflow="the drifting background shapes reach past the frame"></div>
    <div id="pwidgets" data-layout-allow-overflow="product widgets fill their boxes"></div>
  </div>
  <div id="clipbox" data-layout-allow-overflow="the presenter layer is clipped below the product in split">
    <div id="pres" data-layout-allow-overflow="the presenter layer scales and moves between layouts">
      <div id="punch" data-layout-allow-overflow="a quick punch-in on key words">
        <div id="beat" data-layout-allow-overflow="a pulse on the music's bars (tournament n06)">
        <div id="zoom" data-layout-allow-overflow="a slow push-in per shot">
          <video id="face" src="presenter.mp4" muted playsinline data-start="0" data-duration="{{DURATION}}"
                 data-track-index="0"></video>
          <div id="bgfx" data-layout-allow-overflow="effects behind the presenter (needs the matte)"></div>
          <div id="room-back" class="room" data-layout-allow-overflow="props behind the presenter, in room space"></div>
          {{MATTE}}
          <div id="room" class="room" data-layout-allow-overflow="props in the room with the presenter"></div>
        </div>
        </div>
      </div>
    </div>
  </div>
  <div id="ring" data-layout-allow-overlap="the bubble's ring sits over the product by design"></div>
  <div id="ov" data-layout-allow-overlap="widgets over the presenter, clear of the face"></div>
  <div id="stage" data-layout-allow-overlap="burned-in captions, clear of the presenter"></div>
  <div id="fxtop" data-layout-allow-overlap="full-frame effects: flash, glitch, fade to black, HUDs">{{FXMEDIA}}</div>
  </div>
  <svg width="0" height="0" style="position:absolute">
    <!-- anime: cel bands with ink lines from the edges. Five levels per channel shifted hues (skin went
         orange, walls green: lab v06); seven levels on a softer image keep hues and still read as cels -->
    <filter id="toon" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="soft"/>
      <feComponentTransfer in="soft" result="post"><feFuncR type="discrete" tableValues="0 .17 .34 .5 .66 .83 1"/>
        <feFuncG type="discrete" tableValues="0 .17 .34 .5 .66 .83 1"/><feFuncB type="discrete" tableValues="0 .17 .34 .5 .66 .83 1"/></feComponentTransfer>
      <feColorMatrix in="soft" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 1 0" result="grey"/>
      <feConvolveMatrix in="grey" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true" result="edge"/>
      <feComponentTransfer in="edge" result="ink"><feFuncR type="linear" slope="-6" intercept="1.12"/>
        <feFuncG type="linear" slope="-6" intercept="1.12"/><feFuncB type="linear" slope="-6" intercept="1.12"/></feComponentTransfer>
      <feBlend in="post" in2="ink" mode="multiply"/>
    </filter>
    <!-- comic: flat colour in a few bands and heavy ink lines from the edges (tournament n07) -->
    <filter id="comic" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="soft"/>
      <feComponentTransfer in="soft" result="post"><feFuncR type="discrete" tableValues="0 .2 .4 .6 .8 1"/>
        <feFuncG type="discrete" tableValues="0 .2 .4 .6 .8 1"/><feFuncB type="discrete" tableValues="0 .2 .4 .6 .8 1"/></feComponentTransfer>
      <feColorMatrix in="soft" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 1 0" result="grey"/>
      <feConvolveMatrix in="grey" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true" result="edge"/>
      <feComponentTransfer in="edge" result="ink"><feFuncR type="linear" slope="-9" intercept="1.15"/>
        <feFuncG type="linear" slope="-9" intercept="1.15"/><feFuncB type="linear" slope="-9" intercept="1.15"/></feComponentTransfer>
      <feMorphology in="ink" operator="erode" radius="1" result="thick"/>
      <feBlend in="post" in2="thick" mode="multiply"/>
    </filter>
    <!-- blocky: big square pixels (sample a dot per block, grow it to fill the block) -->
    <filter id="blocky" x="0" y="0" width="1" height="1">
      <feFlood x="{{BLOCK_HALF}}" y="{{BLOCK_HALF}}" height="2" width="2"/>
      <feComposite width="{{BLOCK}}" height="{{BLOCK}}"/>
      <feTile result="dots"/>
      <feComposite in="SourceGraphic" in2="dots" operator="in"/>
      <feMorphology operator="dilate" radius="{{BLOCK_HALF}}"/>
    </filter>
    <!-- the build into blocky: a quarter and a half of its block (n02 review: a hard cut read as a glitch) -->
        <filter id="bk0" x="0" y="0" width="1" height="1">
      <feFlood x="{{BLOCK_Q_HALF}}" y="{{BLOCK_Q_HALF}}" height="2" width="2"/>
      <feComposite width="{{BLOCK_Q}}" height="{{BLOCK_Q}}"/>
      <feTile result="dots"/>
      <feComposite in="SourceGraphic" in2="dots" operator="in"/>
      <feMorphology operator="dilate" radius="{{BLOCK_Q_HALF}}"/>
    </filter>
        <filter id="bk1" x="0" y="0" width="1" height="1">
      <feFlood x="{{BLOCK_H_HALF}}" y="{{BLOCK_H_HALF}}" height="2" width="2"/>
      <feComposite width="{{BLOCK_H}}" height="{{BLOCK_H}}"/>
      <feTile result="dots"/>
      <feComposite in="SourceGraphic" in2="dots" operator="in"/>
      <feMorphology operator="dilate" radius="{{BLOCK_H_HALF}}"/>
    </filter>
  </svg>
</div>
<script type="application/json" id="reel-data">{{DATA}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("reel-data").textContent);
  const DUR = D.duration;
  const tl = gsap.timeline({ paused: true });
  MK.fps = D.fps || 30;  // stepped animations land on whole frames

  // Presenter layouts (as create/kit/layout.html).
  const P = D.poses, T = D.transition;
  // Clip shapes are built in CSS from numeric custom properties: GSAP tweens numbers reliably, while
  // tweening clip-path strings between poses produced garbage centres (the presenter vanished mid-move).
  const state = (p) => ({ x: p.x, y: p.y, scale: p.scale, opacity: p.layout === "off" ? 0 : 1,
    "--r": p.r + "px", "--cx": p.cx + "px", "--cy": p.cy + "px" });
  const ringOn = (p) => (p.layout === "pip" ? 1 : 0);
  const box = (p) => ({ "--top": p.top + "px" });
  gsap.set("#clipbox", box(P[0])); gsap.set("#pres", state(P[0])); gsap.set("#ring", { opacity: ringOn(P[0]) });
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i];
    if (a.layout === b.layout && a.x === b.x && a.y === b.y && a.scale === b.scale && a.top === b.top) continue;
    const at = Math.max(0, b.t - T / 2);
    tl.fromTo("#clipbox", box(a), Object.assign(box(b), { duration: T, ease: "power3.inOut", immediateRender: false }), at);
    tl.fromTo("#pres", state(a), Object.assign(state(b), { duration: T, ease: "power3.inOut", immediateRender: false }), at);
    if (ringOn(a) && !ringOn(b)) tl.fromTo("#ring", { opacity: 1 }, { opacity: 0, duration: T * 0.3, ease: "none", immediateRender: false }, at);
    if (!ringOn(a) && ringOn(b)) tl.fromTo("#ring", { opacity: 0 }, { opacity: 1, duration: T * 0.3, ease: "none", immediateRender: false }, at + T * 0.7);
  }

  // Split: each shot's head is moved clear of the seam (reel.py split_heads): a hard step at the cut, taken
  // off again as the layout leaves. #beat carries it (its other tweens only scale).
  let shiftY = 0;
  (D.shifts || []).slice().sort((a, b) => a[0] - b[0]).forEach(function (e) {
    if (e[2] > 0) tl.fromTo("#beat", { y: shiftY }, { y: e[1], duration: e[2], ease: "power3.inOut", immediateRender: false }, e[0]);
    else tl.set("#beat", { y: e[1] }, e[0]);
    shiftY = e[1];
  });

  // A slow push-in per shot, about the face, reset at each cut. With the style's push_alternate (ADR 0033)
  // shots push in and out in turn, so the scale carries over the cut instead of snapping back.
  const M = D.motion || {};
  D.shots.forEach(function (s, i) {
    const o = s.ox.toFixed(1) + "px " + s.oy.toFixed(1) + "px";
    const back = M.push_alternate && i % 2 === 1;
    tl.set("#zoom", { scale: back ? D.push : 1, transformOrigin: o }, s.t0);
    if (D.push > 1) tl.fromTo("#zoom", { scale: back ? D.push : 1 }, { scale: back ? 1 : D.push, duration: Math.max(0.1, s.t1 - s.t0), ease: "none", immediateRender: false }, s.t0);
  });

  // The product area lives with the edit (ADR 0033): soft shapes drift behind the cards; on each cut the
  // background shifts a little and the cards settle, like the jump cut below them.
  const pbg = document.getElementById("pbg"), pwidgets = document.getElementById("pwidgets");
  if (M.bg === "drift") { const amb = MK.ambient({ duration: DUR, loop_s: M.bg_drift_s }); pbg.appendChild(amb.el); amb.play(tl); }
  if (M.cut_nudge) {
    let px = 0;
    (D.cuts || []).forEach(function (c, k) {
      const nx = (k % 2 ? -1 : 1) * (M.cut_nudge_px || 0);
      tl.fromTo(pbg, { x: px }, { x: nx, duration: 0.5, ease: "power3.out", immediateRender: false }, c);
      tl.fromTo("#product", { backgroundPosition: px + "px 0px" }, { backgroundPosition: nx + "px 0px", duration: 0.5, ease: "power3.out", immediateRender: false }, c);
      tl.fromTo(pwidgets, { scale: 1 }, { scale: 1.012, duration: 0.06, ease: "power2.out", immediateRender: false }, c);
      tl.to(pwidgets, { scale: 1, duration: 0.35, ease: "power2.inOut" }, c + 0.06);
      px = nx;
    });
  }

  // Punch-ins: a quick zoom about the face on a key word, held while it is said, then back.
  D.punches.forEach(function (p) {
    const o = p.ox.toFixed(1) + "px " + p.oy.toFixed(1) + "px";
    tl.set("#punch", { transformOrigin: o }, p.t0);
    const held = !!p.scale;  // a held zoom eases in over the word and out on its `until` word
    tl.fromTo("#punch", { scale: 1 }, { scale: p.scale || D.punch_scale, duration: held ? 0.35 : 0.12, ease: held ? "power2.inOut" : "power2.out", immediateRender: false }, p.t0);
    tl.to("#punch", { scale: 1, duration: held ? 0.4 : 0.35, ease: "power2.inOut" }, Math.max(p.t0 + 0.2, p.t1));
  });

  // On the beat (tournament n06): each bar's first beat gives the frame a small zoom pulse.
  if (D.beats && D.beats.bars) D.beats.bars.forEach(function (t) {
    tl.fromTo("#beat", { scale: 1 }, { scale: D.beats.pulse, duration: 0.06, ease: "power2.out", immediateRender: false }, t);
    tl.to("#beat", { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.06);
  });

  // Widgets: product ones in the product area, overlays over the presenter.
  const built = [], carried = [];
  D.items.forEach(function (it, i) {
    const layer = document.getElementById(it.where === "product" ? "pwidgets" : "ov");
    const travels = ["push", "stack"].indexOf(it.handover) >= 0 || it.handover_out === "push";
    const bx = document.createElement("div"); bx.className = "box" + (it.align === "top" ? " top" : "") + (travels ? " clip" : ""); bx.id = "item" + i;
    if (travels) {  // clipped while it travels: flush at the top for a push (the old card's sliver stays under the label), room for a stack's spring
      bx.style.setProperty("--ct", it.handover === "stack" ? "-24px" : "0px");
      [[it.handover, it.t0], [it.handover_out, it.t1 - M.handover_s]].forEach(function (h) {
        if (!h[0] || h[0] === "cut") return;
        tl.set(bx, { "--open": 0 }, h[1]);
        tl.set(bx, { "--open": 1 }, h[1] + M.handover_s);  // open again the moment the card is at rest (its shadow returns with it)
      });
    }
    const [x0, y0, x1, y1] = it.box;
    Object.assign(bx.style, { left: x0 + "px", top: y0 + "px", width: (x1 - x0) + "px", height: (y1 - y0) + "px" });
    const fit = document.createElement("div"); fit.className = "fit"; bx.appendChild(fit);
    layer.appendChild(bx);
    const wdg = MK.build(Object.assign({}, it.spec, { kind: it.kind, w: it.w, t0: it.t0, t1: it.t1, marks: it.marks,
      handover_in: it.handover, handover_out: it.handover_out, handover_s: M.handover_s }));
    fit.appendChild(wdg.el);
    built[i] = { root: wdg.root, el: wdg.el, box: bx, t0: it.t0, t1: it.t1, layer: layer };  // the carrier goes under the boxes here
    if (it.path) {  // held on the palm (tournament n04): the box rides the tracked hand
      bx.classList.add("held");
      // transforms, not left/top (HyperFrames lint: layout properties snap to whole pixels and stutter)
      tl.set(bx, { x: it.path[0][1] - x0, y: it.path[0][2] - y0, rotation: it.path[0][3] || 0, transformOrigin: "50% 100%" }, 0);
      for (let k = 1; k < it.path.length; k++) {
        const a = it.path[k - 1], b = it.path[k];
        tl.to(bx, { x: b[1] - x0, y: b[2] - y0, rotation: b[3] || 0, duration: Math.max(0.01, b[0] - a[0]), ease: "none" }, a[0]);
      }
    }
    // fit the box: scale down when too big, up to UP when there is room (re-fitted once fonts are in)
    const up = it.path ? 1.2 : D.fit_up;  // a card held on the hand stays near its own size (it moves: no room to grow)
    const fitIt = () => gsap.set(fit, { scale: Math.min(up, (x1 - x0) / wdg.el.offsetWidth, (y1 - y0) / wdg.el.offsetHeight) });
    fitIt();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitIt);
    wdg.play(tl);
  });
  // Hand-overs between product cards (ADR 0033, MK.handover): the next card takes over from the last in one
  // motion. Their geometry is read when the tweens first render; once the fonts are in, it is read again.
  D.items.forEach(function (it, i) {
    if (!it.handover || it.handover === "cut" || it.prev == null || !built[it.prev]) return;
    MK.handover(tl, built[it.prev], built[i], it.handover, M.handover_s, built[i].layer).forEach(function (tw) { carried.push(tw); });
  });
  if (carried.length && document.fonts && document.fonts.ready) document.fonts.ready.then(function () { carried.forEach(function (tw) { tw.invalidate(); }); });
  // A step label shared by a run of cards (ADR 0033, MK.kicker), at the top of their box.
  (D.kickers || []).forEach(function (k, i) {
    const bx = document.createElement("div"); bx.className = "box kick"; bx.id = "kick" + i;
    const [x0, y0, x1, y1] = k.box;
    Object.assign(bx.style, { left: x0 + "px", top: y0 + "px", width: (x1 - x0) + "px", height: (y1 - y0) + "px" });
    document.getElementById("product").appendChild(bx);  // not in #pwidgets: the label is the anchor, it does not settle with the cards
    const w = MK.kicker({ text: k.text, steps: k.steps, t0: k.t0, t1: k.t1, w: x1 - x0 });
    bx.appendChild(w.el);
    w.play(tl);
  });

  // Captions (as create/kit/captions.html; karaoke), each group at the height reel.py chose.
  const stage = document.getElementById("stage");
  const caps = D.groups.map(function (g, gi) {
    const el = document.createElement("div");
    el.className = "cap" + (g.light ? " light" : "") + (D.plate ? " plate" : ""); el.id = "g" + gi; el.style.top = g.cy + "px";
    const txt = document.createElement("div"); txt.className = "txt";
    if (D.plate) {
      const n = parseInt(D.plate.color.slice(1), 16);
      Object.assign(txt.style, { background: "rgba(" + [(n >> 16) & 255, (n >> 8) & 255, n & 255, D.plate.alpha].join(",") + ")",
        padding: D.plate.pad_y + "px " + D.plate.pad_x + "px", borderRadius: D.plate.radius_px + "px", boxShadow: D.plate.shadow });
    }
    g.words.forEach(function (w, wi) {
      if (wi) txt.appendChild(document.createTextNode(" "));
      const s = document.createElement("span"); s.className = "w"; s.textContent = w.w; txt.appendChild(s);
    });
    el.appendChild(txt); stage.appendChild(el);
    return el;
  });
  function balance() {
    caps.forEach(function (el) {
      if (el.classList.contains("two") || el.scrollWidth <= D.max_width) return;
      const spans = Array.prototype.slice.call(el.querySelectorAll(".w"));
      if (spans.length < 2) { const size = parseFloat(getComputedStyle(el).fontSize); el.style.fontSize = Math.floor(size * D.max_width / el.scrollWidth) + "px"; return; }
      const widths = spans.map(function (s) { return s.getBoundingClientRect().width; });
      let best = 1, bestMax = Infinity;
      for (let k = 1; k < spans.length; k++) {
        const a = widths.slice(0, k).reduce(function (x, y) { return x + y; }, 0);
        const b = widths.slice(k).reduce(function (x, y) { return x + y; }, 0);
        if (Math.max(a, b) < bestMax) { bestMax = Math.max(a, b); best = k; }
      }
      spans[best].parentNode.insertBefore(document.createElement("br"), spans[best]);
      el.classList.add("two");
    });
  }
  balance();
  gsap.set(".cap", { xPercent: -50, yPercent: -50 });
  // a plate that wrapped to two lines grows upwards where the group sits on a bottom edge (seam, low bubble)
  if (D.plate) caps.forEach(function (el, gi) {
    if (D.groups[gi].zone === "seam" && el.offsetHeight > D.plate.h1 + 4) gsap.set(el, { y: -(el.offsetHeight - D.plate.h1) / 2 });
  });
  gsap.set(".cap .txt", { opacity: 0 });
  // the spoken word's colour is a variable, so an effect can recolour the brand accent mid-video (a code edit
  // that "changes the colour of the video": lab v04, where a hue-rotate turned the presenter green)
  document.getElementById("canvas").style.setProperty("--cap-active", D.active);
  D.groups.forEach(function (g, gi) {
    const el = caps[gi], txt = el.querySelector(".txt"), next = D.groups[gi + 1];
    const text = g.light || D.plate ? D.text_light : D.text, active = "var(--cap-active)";
    // words not yet said: fully opaque in a muted tone, so their outline stays solid. Dimming by opacity also
    // faded the outline and they washed out on a light wall (fred-and-pixie r03)
    const mix = function (c, k) {  // a hex colour mixed toward a blue grey
      if (!/^#[0-9a-f]{6}$/i.test(c)) return c;
      const n = parseInt(c.slice(1), 16), g2 = [0x8a, 0x96, 0xa8];
      return "rgb(" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v, i) { return Math.round(v * k + g2[i] * (1 - k)); }).join(",") + ")";
    };
    const muted = g.light || D.plate ? text : mix(text, D.dim);
    gsap.set(el.querySelectorAll(".w"), { opacity: 1, color: muted });
    // in on a hard cut with a small scale pop (r18 reviews: a 0.14 s fade caught mid-way read as a grey ghost)
    tl.set(txt, { opacity: 1 }, Math.max(0, g.start));
    tl.fromTo(txt, { y: 6, scale: 0.92 }, { y: 0, scale: 1, duration: 0.14, ease: "back.out(2)", immediateRender: false }, Math.max(0, g.start));
    const spans = el.querySelectorAll(".w");
    g.words.forEach(function (w, wi) {
      const at = Math.max(g.start, w.t - 0.04);
      const nw = g.words[wi + 1];
      if (D.caption_style === "pill" && !D.plate) {  // white on an accent pill: readable on any wall (tournament reviews)
        tl.set(spans[wi], { color: "#ffffff", backgroundColor: active, className: "w pill" }, at);
        if (nw) tl.set(spans[wi], { color: text, backgroundColor: "rgba(0,0,0,0)", className: "w" }, Math.max(at + 0.01, nw.t - 0.04));
      } else {
        tl.set(spans[wi], { color: active }, at);
        if (nw) tl.set(spans[wi], { color: text }, Math.max(at + 0.01, nw.t - 0.04));
      }
    });
    const joined = !!next && next.start - g.end <= 0.15;
    const tOut = joined ? next.start - 0.08 : Math.min(g.end, DUR - 0.1);
    tl.set(txt, { opacity: 0 }, tOut);  // out on a hard cut too
    tl.set(el, { opacity: 0, visibility: "hidden" }, Math.min(tOut + 0.1, DUR));
  });

  // Props in the room and effects (create/kit/props.js, ADR 0027).
  PROPS.play(D, tl);

  tl.set({}, {}, DUR);
  window.__timelines = window.__timelines || {};
  window.__timelines["reel"] = tl;
})();
</script>
</body>
</html>
