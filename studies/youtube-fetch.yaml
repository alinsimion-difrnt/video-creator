# YouTube for the two studies (studies/README.md). YouTube blocks the cloud, so a Claude session on Robert's
# laptop runs scripts/study_youtube_fetch.py (studies/youtube-fetch.md). Each source names its track; the
# tracks stay independent: pixel-art items land in studies/pixel-art/youtube.yaml and r2 study/pixel-art/,
# tiktok-track items in studies/tiktok/youtube.yaml and r2 study/tiktok/.
#
# A source is one of:
#   url:     a video, a playlist, or a channel tab (https://www.youtube.com/@name/shorts or /videos)
#   search:  a YouTube search phrase (yt-dlp "ytsearchN:")
# with: track, subject (a slug), take (how many videos), max_seconds. A channel url that fails falls back to
# `fallback_search` when given.
defaults:
  max_seconds: 1200
  take: 5

sources:
# --- pixel art: the creators Robert named --------------------------------------------------------------
- {track: pixel-art, subject: mortmort, url: "https://www.youtube.com/@MortMort/videos", take: 6, fallback_search: "MortMort pixel art"}
- {track: pixel-art, subject: mortmort, url: "https://www.youtube.com/@MortMort/shorts", take: 6, max_seconds: 180}
- {track: pixel-art, subject: slynyrd, url: "https://www.youtube.com/@Slynyrd/videos", take: 5, fallback_search: "Slynyrd pixel art timelapse"}
