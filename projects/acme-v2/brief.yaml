product:
  name: Acme
  spoken: Ack-me
  url: https://acme.example
  one_liner: Tracks which brands ChatGPT, Gemini and Perplexity recommend, against the competitors you pick.
audience: Marketing leads and agency owners at small and mid-size companies who are starting to ask whether AI assistants
  recommend them.
destination: linkedin
format: narrated_explainer
length:
  min_s: 90
  max_s: 115
tone: 'Warm, plain and specific: a person describing what the product does. No slogans, no rhetorical pairs. Zara
  warm (ADR 0018).'
message: AI assistants now hand out short lists, and Acme shows you whether you are on them, and why.
facts:
- id: engines
  claim: Tracks ChatGPT, Gemini and Perplexity
  source: https://acme.example (homepage, 'ChatGPT · Gemini · Perplexity')
- id: daily
  claim: Prompts are tracked daily on paid plans (every 3 days on the free plan)
  source: https://acme.example ('Daily Automated Tracking'); https://acme.example/pricing
- id: competitors
  claim: Compares you with the competitors you choose, on the same prompts
  source: https://acme.example ('Unlimited competitors')
- id: prompt_suggestions
  claim: Suggests prompts tailored to your category
  source: https://acme.example ('20 high-intent prompts tailored to category')
- id: personas
  claim: Prompts can be asked as different personas
  source: https://acme.example/pricing (Personas per plan)
- id: real_browser
  claim: Collects answers from the real apps, as a customer sees them; the API is only a backup, in under 1% of
    runs
  source: https://acme.example ('Browser-Authentic'); backup share from Robert, 2026-10-06 (the site's 'not APIs'
    overstates it)
- id: metrics
  claim: Reports visibility, share of voice, sentiment and mentions per brand
  source: https://acme.example (core metrics)
- id: sentiment
  claim: Scores how positively the AI describes each brand (out of 10; positive, neutral or negative), compared
    with competitors
  source: https://acme.example ('Sentiment 8.2/10 positive', per-brand sentiment table)
- id: topic_sentiment
  claim: Prompts are grouped into topics, and sentiment is scored per topic (e.g. a bank's interest rates, a restaurant's
    burger, a clinic's waiting time)
  source: Robert, Acme product owner, 2026-10-06 (not yet described on acme.example; add it there before publishing)
- id: sources
  claim: Tracks which domains and URLs the AI cites
  source: https://acme.example ('Citation Sources')
- id: source_types
  claim: 'Cited sources reach well beyond search results: Reddit threads, parent groups on Facebook, student forums,
    YouTube creators, depending on the category; they show where to work on visibility'
  source: 'Robert, Acme product owner, 2026-10-06 (examples from tracked categories); source tracking itself:
    https://acme.example (''Citation Sources'')'
- id: alerts
  claim: Alerts when tracked citations or visibility change
  source: https://acme.example (watchlist alerts)
- id: pitch_reports
  claim: Agencies can send a prospect a real visibility report as a link; when they sign, it becomes their live
    project
  source: https://acme.example/partners/agencies (Prospect Pitch Reports)
- id: pitch_pay_on_sign
  claim: Agencies only pay for a pitch report if the prospect signs with them
  source: Robert, Acme product owner, 2026-10-06 (not yet stated on acme.example; add it to the agency or pricing
    page before publishing)
- id: free_plan
  claim: Free plan, no card
  source: https://acme.example/pricing ('No card, no time limit')
