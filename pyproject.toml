[project]
name = "explainer-video-creator"
version = "0.1.0"
description = "Research, understand and create premium SaaS explainer videos. Phase 1: the `lens` CLI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "boto3>=1.43.108",
    "opencv-python-headless>=5.0.0.93",
    "librosa>=1.0.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "faster-whisper>=1.2.1",
    "demucs>=4.0.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "transformers>=5.18.0",
    "fonttools>=4.66.1",
    "brotli>=1.2.0",
]

[project.scripts]
lens = "lens.cli:app"
create = "create.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "moto[s3]>=5.2.3",
    "pytest-xdist>=3.6",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens", "create", "study"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"lens/report/__init__.py" = ["E501"]  # inline HTML/CSS template
"scripts/hyperframes_answer_key.py" = ["E501"]  # embedded browser JavaScript
"create/audit.py" = ["E501"]  # embedded browser JavaScript
"scripts/eval_answer_key.py" = ["E501"]  # Markdown table rows
".claude/skills/resolve-fix-take/resolve/*.py" = ["F821"]  # Resolve run_script bodies: `resolve` is injected

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lens.schemas.*", "lens.stages"]  # add "lens.measure.*" in M4
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"  # pytest-xdist: the suite takes ~2 min on 4 cores instead of ~5 (-n 0 for one process)
markers = ["slow: needs local models (whisper); run with -m slow or by default"]

# CPU-only PyTorch (demucs): the default Linux wheels bundle CUDA (~2 GB) we never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
